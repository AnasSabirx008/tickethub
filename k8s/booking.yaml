apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: tickethub
spec:
  replicas: 2
  selector:
    matchLabels: {app: booking}
  template:
    metadata:
      labels: {app: booking}
    spec:
      automountServiceAccountToken: false   # no K8s API access needed (+ frees /run/secrets for our Secret)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001                                  # lets uid 10001 read the mounted Secret
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: booking
          image: tickethub/booking:0.1.0
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: APP_VERSION, value: "0.1.0"}
            - {name: DATABASE_URL, value: "postgresql+psycopg://tickethub@postgres:5432/bookings"}  # no password
            - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/db_password}
            - {name: INVENTORY_URL, value: "http://inventory:8000"}
          readinessProbe:                               # checks the DB
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:                                # process only: a DB outage must not restart us
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: db-password, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: db-password
          secret:
            secretName: postgres-credentials
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: tickethub
spec:
  selector: {app: booking}
  ports: [{name: http, port: 8000, targetPort: http}]
