apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickethub
  namespace: tickethub
spec:
  ingressClassName: traefik          # which ingress controller handles this rule
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: 8080}
