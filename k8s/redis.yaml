apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tickethub
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}        # "I manage the Pods that carry this label"
  template:                          # the Pod model to create
    metadata:
      labels: {app: redis}           # must match the selector
    spec:
      containers:
        - name: redis
          image: redis:7
          ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata:
  name: redis                        # this name becomes the DNS name "redis"
  namespace: tickethub
spec:
  selector: {app: redis}             # sends traffic to Pods labelled app=redis
  ports: [{port: 6379, targetPort: 6379}]
